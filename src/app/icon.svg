<!-- IMU mark. Identical artwork to src/components/brand/ImuMark.tsx (header)
     and the tile in src/app/opengraph-image.tsx — change all three together.
     底色 中国红 #E60012，字 鱼肚白 #F0FCFF。

     Lives in src/app/ (not public/) on purpose: Next hashes app-dir icons into
     the <link> URL, so editing this file automatically busts the browser's
     favicon cache. Favicons are cached far more stubbornly than normal assets —
     a plain /favicon.svg in public/ kept serving the old mark to tabs that had
     already seen it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IMU">
  <rect width="100" height="100" rx="26" fill="#E60012"/>

  <!-- Monoline IMU. Round caps keep the mark humane rather than technical,
       and heavy strokes keep all three letters legible down to 16px. -->
  <g fill="none" stroke="#F0FCFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 36 V68"/>
    <path d="M33 68 V37 L45 54 L57 37 V68"/>
    <path d="M67 36 V57 C67 63.5 71.5 68 76 68 C80.5 68 85 63.5 85 57 V36"/>
  </g>
</svg>
