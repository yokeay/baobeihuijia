<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IMU">
  <defs>
    <!-- Warm clay gradient: light falling on terracotta, not a flat brand fill -->
    <linearGradient id="imuTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D98166"/>
      <stop offset="0.55" stop-color="#C5705A"/>
      <stop offset="1" stop-color="#A85440"/>
    </linearGradient>
    <!-- Soft top highlight so the squircle reads as a physical tile -->
    <radialGradient id="imuGlow" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="26" fill="url(#imuTile)"/>
  <rect width="100" height="100" rx="26" fill="url(#imuGlow)"/>

  <!-- Monoline IMU. Round caps keep the mark humane rather than technical,
       and heavy strokes keep all three letters legible down to 16px. -->
  <g fill="none" stroke="#FFF6F1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 36 V68"/>
    <path d="M33 68 V37 L45 54 L57 37 V68"/>
    <path d="M67 36 V57 C67 63.5 71.5 68 76 68 C80.5 68 85 63.5 85 57 V36"/>
  </g>
</svg>
